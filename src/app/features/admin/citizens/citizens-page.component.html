<section>
  <div class="page-header"><div><h1>Gestionar ciudadanos</h1></div><button class="btn btn-secondary" (click)="reset()">Nuevo</button></div>
  @if (error) { <div class="alert error">{{ error }}</div> }
  @if (message) { <div class="alert success">{{ message }}</div> }
  <div class="panel">
    <div class="form-grid">
      <label>Nombre<input [(ngModel)]="form.name" /></label>
      <label>Correo<input [(ngModel)]="form.email" /></label>
      <label>Celular<input [(ngModel)]="form.phone" /></label>
      <label>Direccion<input [(ngModel)]="form.address" /></label>
      <label>Estado<select [(ngModel)]="form.status"><option value="active">Activo</option><option value="inactive">Inactivo</option></select></label>
    </div>
    <div class="map-section">
      <h2>Ubicacion en el mapa</h2>
      <app-map-pin-picker
        [latitude]="form.latitude ?? null"
        [longitude]="form.longitude ?? null"
        (locationChange)="onLocationChange($event)"
      />
    </div>
    <button class="btn btn-primary" (click)="save()">{{ editingId ? 'Actualizar' : 'Guardar' }}</button>
  </div>
  <div class="panel">
    <table><thead><tr><th>Nombre</th><th>Correo</th><th>Direccion</th><th>Acciones</th></tr></thead>
      <tbody>@for (item of items; track item.id_citizen) {<tr><td>{{ item.name }}</td><td>{{ item.email }}</td><td>{{ item.address }}</td><td class="actions"><button class="btn btn-secondary" (click)="edit(item)">Editar</button><button class="btn btn-danger" (click)="remove(item)">Eliminar</button></td></tr>}</tbody>
    </table>
  </div>
</section>
