<section>
  <div class="page-header"><div><h1>Gestionar comunas</h1></div><button class="btn btn-secondary" (click)="reset()">Nueva</button></div>
  @if (error) { <div class="alert error">{{ error }}</div> }
  @if (message) { <div class="alert success">{{ message }}</div> }
  <div class="panel">
    <div class="form-grid">
      <label>Departamento
        <select [(ngModel)]="selectedDepartmentId" (ngModelChange)="onDepartmentChange()">
          <option [ngValue]="0">Todos</option>
          @for (d of departments; track d.id_department) { <option [ngValue]="d.id_department">{{ d.name }}</option> }
        </select>
      </label>
      <label>Ciudad
        <select [(ngModel)]="form.id_city">
          <option [ngValue]="0">Seleccione</option>
          @for (c of filteredCities; track c.id_city) { <option [ngValue]="c.id_city">{{ c.name }}</option> }
        </select>
      </label>
      <label>Nombre comuna<input [(ngModel)]="form.name" /></label>
      <label>Estado<select [(ngModel)]="form.status"><option value="active">Activa</option><option value="inactive">Inactiva</option></select></label>
    </div>
    <button class="btn btn-primary" (click)="save()">{{ editingId ? 'Actualizar' : 'Guardar' }}</button>
  </div>
  <div class="panel">
    <table><thead><tr><th>Nombre</th><th>Ciudad</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>@for (item of items; track item.id_commune) {<tr><td>{{ item.name }}</td><td>{{ cityName(item.id_city) }}</td><td>{{ item.status }}</td><td class="actions"><button class="btn btn-secondary" (click)="edit(item)">Editar</button><button class="btn btn-danger" (click)="remove(item)">Eliminar</button></td></tr>}</tbody>
    </table>
  </div>
</section>
