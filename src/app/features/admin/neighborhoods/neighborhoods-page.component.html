<section>
  <div class="page-header"><div><h1>Gestionar barrios</h1></div><button class="btn btn-secondary" (click)="reset()">Nuevo</button></div>
  @if (error) { <div class="alert error">{{ error }}</div> }
  @if (message) { <div class="alert success">{{ message }}</div> }
  <div class="panel">
    <div class="form-grid">
      <label>Departamento
        <select [(ngModel)]="selectedDepartmentId" (ngModelChange)="onDepartmentChange()">
          <option [ngValue]="0">Seleccione</option>
          @for (d of departments; track d.id_department) { <option [ngValue]="d.id_department">{{ d.name }}</option> }
        </select>
      </label>
      <label>Ciudad
        <select [(ngModel)]="selectedCityId" (ngModelChange)="onCityChange()">
          <option [ngValue]="0">Seleccione</option>
          @for (c of filteredCities; track c.id_city) { <option [ngValue]="c.id_city">{{ c.name }}</option> }
        </select>
      </label>
      <label>Comuna
        <select [(ngModel)]="form.id_commune">
          <option [ngValue]="0">Seleccione</option>
          @for (c of filteredCommunes; track c.id_commune) { <option [ngValue]="c.id_commune">{{ c.name }}</option> }
        </select>
      </label>
      <label>Nombre barrio<input [(ngModel)]="form.name" /></label>
      <label>Estado<select [(ngModel)]="form.status"><option value="active">Activo</option><option value="inactive">Inactivo</option></select></label>
    </div>
    <button class="btn btn-primary" (click)="save()">{{ editingId ? 'Actualizar' : 'Guardar' }}</button>
  </div>
  <div class="panel">
    <table><thead><tr><th>Nombre</th><th>Comuna</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>@for (item of items; track item.id_neighborhood) {<tr><td>{{ item.name }}</td><td>{{ communeName(item.id_commune) }}</td><td>{{ item.status }}</td><td class="actions"><button class="btn btn-secondary" (click)="edit(item)">Editar</button><button class="btn btn-danger" (click)="remove(item)">Eliminar</button></td></tr>}</tbody>
    </table>
  </div>
</section>
